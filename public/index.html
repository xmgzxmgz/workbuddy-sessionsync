<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SessionSync · 云端会话同步</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --border: #e6e8ee; --text: #1a2233;
  --muted: #8b94a7; --accent: #4a6cf7; --accent-2: #6a85f9; --accent-soft: #eef1fe;
  --green: #16a67b; --green-soft: #e7f7f0; --red: #e05252; --red-soft: #fdeeee;
  --amber: #d98a2b; --amber-soft: #fdf4e6;
  --radius: 14px; --shadow: 0 1px 3px rgba(20,30,60,.05);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font: inherit; border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; background: #fff; color: var(--text); transition: border .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,108,247,.12); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #d3d8e2; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #b9c0ce; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 登录 ---------- */
#login { display: flex; height: 100vh; align-items: center; justify-content: center; background: linear-gradient(135deg, #eef1fb 0%, #f6f7f9 60%); }
#login .box { width: 400px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 44px 40px; box-shadow: 0 12px 40px rgba(30,50,120,.08); text-align: center; }
#login .mark { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
#login h1 { font-size: 21px; letter-spacing: .5px; }
#login p { color: var(--muted); margin: 8px 0 26px; font-size: 13px; }
#login input { width: 100%; margin-bottom: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 8px 16px; font-weight: 500; transition: all .15s; border: 1px solid var(--border); background: var(--panel); }
.btn:hover { border-color: #c6cddb; background: #fafbfd; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(74,108,247,.25); }
.btn.primary:hover { background: #3d5ef0; }
.btn.ghost { border: none; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: #eef0f5; }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: var(--red-soft); border-color: #f3caca; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }

/* ---------- 应用框架 ---------- */
#app { display: none; height: 100vh; flex-direction: column; }
header.topbar { display: flex; align-items: center; gap: 14px; padding: 0 20px; height: 56px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
header.topbar .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15.5px; }
header.topbar .brand .mark { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.live-badge { display: inline-flex; align-items: center; gap: 7px; background: var(--green-soft); color: var(--green); font-weight: 600; border-radius: 20px; padding: 4px 13px; font-size: 12.5px; }
.eye-btn { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #6b7688; border: 1px solid transparent; transition: all .15s; flex-shrink: 0; }
.eye-btn:hover { background: #f1f3f8; color: var(--text); }
.eye-btn.on { background: var(--accent-soft); color: var(--accent); }
.live-badge .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); position: relative; }
.live-badge .pulse::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--green); opacity: 0; animation: ping 2s infinite; }
.live-badge.off { background: #f0f1f4; color: var(--muted); }
.live-badge.off .pulse, .live-badge.off .pulse::after { background: #b9c0ce; border-color: #b9c0ce; animation: none; }
@keyframes ping { 0% { transform: scale(.6); opacity: .8; } 80%, 100% { transform: scale(1.6); opacity: 0; } }
#global-search { flex: 1; max-width: 520px; margin-left: auto; background: #f4f5f8; border-color: transparent; }
#global-search:focus { background: #fff; }
main.frame { flex: 1; display: flex; min-height: 0; }
nav.sidenav { width: 190px; border-right: 1px solid var(--border); background: var(--panel); padding: 14px 10px; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
nav.sidenav a { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 10px; color: #525d72; cursor: pointer; font-weight: 500; transition: all .12s; }
nav.sidenav a:hover { background: #f1f3f8; color: var(--text); }
nav.sidenav a.active { background: var(--accent-soft); color: var(--accent); }
nav.sidenav .spacer { flex: 1; }
nav.sidenav .server-info { font-size: 11.5px; color: var(--muted); padding: 0 13px; line-height: 1.7; }
#content { flex: 1; overflow-y: auto; min-width: 0; }

/* ---------- 通用组件 ---------- */
.page { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
.page-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
.page-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; font-size: 11.5px; font-weight: 500; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 13.5px; }
.empty .icon { font-size: 34px; display: block; margin-bottom: 10px; opacity: .55; }
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px); background: #202a3d; color: #fff; padding: 11px 24px; border-radius: 12px; font-size: 13.5px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 99; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
mark { background: #ffec9e; padding: 0 2px; border-radius: 3px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
td { padding: 10px; border-top: 1px solid var(--border); font-size: 13.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.on { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.dot.off { background: #c6ccd8; }
code { font-family: var(--mono); background: #f1f3f7; padding: 2px 7px; border-radius: 5px; font-size: 12px; }

/* ---------- 仪表盘 ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); transition: transform .15s; }
.stat-card:hover { transform: translateY(-2px); }
.stat-card .num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-card .label { color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-card .icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; margin-bottom: 12px; }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.feed { max-height: 420px; overflow-y: auto; }
.feed-item { display: flex; gap: 11px; padding: 10px 2px; border-bottom: 1px dashed var(--border); animation: fadein .3s; }
.feed-item:last-child { border-bottom: none; }
@keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }
.feed-item .fi-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.feed-item .fi-body { flex: 1; min-width: 0; }
.feed-item .fi-title { font-size: 13px; font-weight: 550; }
.feed-item .fi-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-item .fi-time { font-size: 11.5px; color: var(--muted); flex-shrink: 0; padding-top: 2px; }
.recent-session { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px dashed var(--border); cursor: pointer; border-radius: 8px; transition: background .12s; }
.recent-session:hover { background: #f6f8fc; }
.recent-session:last-child { border-bottom: none; }

/* ---------- 会话双栏 ---------- */
.sessions-layout { display: flex; height: 100%; min-height: 0; }
.sess-list-pane { width: 330px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; flex-shrink: 0; }
.sess-list-pane .pane-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
.sess-list-pane .pane-head input { width: 100%; margin-bottom: 8px; }
.sess-scroll { flex: 1; overflow-y: auto; padding: 8px; }
.sess-item { padding: 11px 12px; border-radius: 11px; cursor: pointer; transition: background .12s; border: 1px solid transparent; margin-bottom: 2px; }
.sess-item:hover { background: #f4f6fa; }
.sess-item.active { background: var(--accent-soft); border-color: #d9e0fc; }
.space-chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:9px; scrollbar-width:none; }
.space-chips::-webkit-scrollbar { display:none; }
.space-chip { white-space:nowrap; font-size:12px; padding:4px 11px; border-radius:20px; background:#f2f4f8; color:#5a6478; cursor:pointer; border:1px solid transparent; transition:all .12s; flex-shrink:0; }
.space-chip:hover { background:#e9edf6; }
.space-chip.active { background:var(--accent-soft); color:var(--accent); border-color:#d5ddfb; font-weight:600; }
.space-chip .n { opacity:.6; margin-left:4px; font-size:11px; }

.sess-item h4 { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-item .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 10px; }
.sess-detail-pane { flex: 1; overflow-y: auto; min-width: 0; background: var(--bg); }
.chat-area { display: flex; flex-direction: column; min-height: 100%; }
.chat-head { padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.chat-body { flex: 1; padding: 22px 26px; max-width: 860px; width: 100%; margin: 0 auto; }
.chat-foot { padding: 14px 26px 20px; background: linear-gradient(transparent, var(--bg) 30%); position: sticky; bottom: 0; }

/* ---------- 聊天气泡 ---------- */
.msg-row { display: flex; gap: 11px; margin-bottom: 18px; animation: fadein .25s; }
.msg-row.user { flex-direction: row-reverse; }
.msg-row .avatar { width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; }
.msg-row.user .avatar { background: linear-gradient(135deg, #4a6cf7, #7b93fa); }
.msg-row.assistant .avatar { background: linear-gradient(135deg, #16a67b, #4ecf9d); }
.msg-row.system .avatar, .msg-row.tool .avatar { background: linear-gradient(135deg, #9aa4b8, #b9c1d1); }
.msg-row .bubble-wrap { max-width: 76%; }
.msg-row.user .bubble-wrap { text-align: right; }
.bubble { padding: 10px 15px; border-radius: 16px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; text-align: left; font-size: 13.8px; }
.msg-row.user .bubble { background: linear-gradient(135deg, #4a6cf7, #5d7af8); color: #fff; border-top-right-radius: 5px; box-shadow: 0 3px 10px rgba(74,108,247,.22); }
.msg-row.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-top-left-radius: 5px; box-shadow: var(--shadow); }
.msg-row.system .bubble, .msg-row.tool .bubble { background: #f1f3f7; color: #5a6478; font-size: 12.8px; border-radius: 12px; }
.msg-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
/* 隐私模式：模糊对话/标题/记忆等敏感文字，便于截图分享 */
body.privacy-mode .bubble,
body.privacy-mode .msg-meta,
body.privacy-mode .sess-item h4,
body.privacy-mode .sess-item .sub,
body.privacy-mode .recent-session > div,
body.privacy-mode .feed-item .fi-title,
body.privacy-mode .feed-item .fi-sub,
body.privacy-mode .memory-row > b,
body.privacy-mode .memory-row > span:not(.tag),
body.privacy-mode .file-row .fname,
body.privacy-mode .chat-head .row b,
body.privacy-mode .chat-head .muted,
body.privacy-mode .chat-head .tag,
body.privacy-mode .chat-head .small,
body.privacy-mode .search-hit b,
body.privacy-mode .search-hit .snip {
  filter: blur(5px);
  transition: filter .18s;
  user-select: none;
}
body.privacy-mode .bubble:hover,
body.privacy-mode .sess-item:hover h4,
body.privacy-mode .sess-item:hover .sub,
body.privacy-mode .memory-row:hover > b,
body.privacy-mode .memory-row:hover > span:not(.tag),
body.privacy-mode .file-row:hover .fname { filter: none; }

.tab-bar { display: flex; gap: 4px; margin-top: 12px; }
.tab-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 9px; font-size: 13px; color: #5a6478; cursor: pointer; transition: all .12s; border: 1px solid transparent; }
.tab-btn:hover { background: #f2f4f8; }
.tab-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tab-btn .cnt { background: #fff; border-radius: 8px; padding: 0 6px; font-size: 11px; opacity: .8; }
.tab-pane { display: none; flex: 1; flex-direction: column; min-height: 0; }
.tab-pane.active { display: flex; }
.pane-inner { max-width: 860px; width: 100%; margin: 0 auto; padding: 22px 26px 40px; }

.composer { display: flex; gap: 10px; align-items: flex-end; max-width: 860px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow); }
.composer textarea { flex: 1; border: none; resize: none; max-height: 120px; padding: 6px 4px; background: transparent; }
.composer textarea:focus { box-shadow: none; border: none; }
.composer select { border: none; background: #f4f5f8; font-size: 12.5px; padding: 6px 8px; }

/* ---------- 文件/记忆 ---------- */
.sub-section { max-width: 860px; margin: 26px auto 0; padding: 0 26px; }
.file-row, .memory-row { display: flex; align-items: center; gap: 11px; padding: 10px 2px; border-bottom: 1px dashed var(--border); }
.file-row:last-child, .memory-row:last-child { border-bottom: none; }
.file-row .ficon { width: 34px; height: 34px; border-radius: 9px; background: var(--amber-soft); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.file-row .fname { font-size: 13.2px; font-weight: 550; font-family: var(--mono); }
.dropzone { border: 1.5px dashed #ccd2de; border-radius: 12px; padding: 16px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; transition: all .15s; margin-top: 10px; }
.dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* ---------- 响应式 ---------- */
@media (max-width: 900px) {
  nav.sidenav { width: 60px; }
  nav.sidenav a span, nav.sidenav .server-info { display: none; }
  .sess-list-pane { width: 260px; }
  .dash-grid { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .sess-list-pane { position: absolute; z-index: 20; width: 100%; height: 100%; box-shadow: 6px 0 24px rgba(0,0,0,.08); }
  .sessions-layout.viewing .sess-list-pane { display: none; }
  #global-search { display: none; }
  .back-btn { display: inline-flex !important; }
}
.back-btn { display: none; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="mark">⇄</div>
    <h1>SessionSync</h1>
    <p>云端会话存储与同步 · 跨设备无缝续接</p>
    <input id="token-input" type="password" placeholder="输入访问令牌" autocomplete="off">
    <button class="btn primary" style="width:100%" onclick="doLogin()">连接服务器</button>
    <p class="muted small" id="login-msg" style="margin-top:16px"></p>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand"><div class="mark">⇄</div>SessionSync</div>
    <div class="live-badge" id="live-badge" title="实时在线的端（SSE 已连接）"><span class="pulse"></span><span id="live-text">连接中…</span></div>
    <input id="global-search" placeholder="🔍 搜索消息 / 会话 / 记忆…（回车）">
    <button class="eye-btn" id="privacy-btn" title="隐私模式：模糊对话内容，方便截图分享（悬停可临时查看）" onclick="togglePrivacy()" aria-pressed="false">
      <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg id="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
    <button class="btn ghost sm" onclick="logout()">退出</button>
  </header>
  <main class="frame">
    <nav class="sidenav" id="nav">
      <a data-view="dashboard"><span>📊</span><span>仪表盘</span></a>
      <a data-view="sessions"><span>🗂</span><span>会话</span></a>
      <a data-view="memories"><span>🧠</span><span>记忆库</span></a>
      <a data-view="sync"><span>🔄</span><span>同步状态</span></a>
      <a data-view="tokens"><span>🔑</span><span>设备令牌</span></a>
      <div class="spacer"></div>
      <div class="server-info" id="server-info"></div>
    </nav>
    <div id="content"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 基础 ================= */
const $ = (s) => document.querySelector(s);
let TOKEN = localStorage.getItem('ss_token') || '';
let DEVICE_NAME = localStorage.getItem('ss_device') || ('浏览器-' + Math.random().toString(36).slice(2, 6).toUpperCase());
let currentView = 'dashboard';
let currentSessionId = null;
let sse = null, sseOnline = false, refreshTimer = null;
let onlineCount = 0, onlineNames = [];
let activityItems = [];

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function fmtTs(ts) {
  if (!ts) return '';
  const d = new Date(ts), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtRel(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 60e3) return '刚刚';
  if (diff < 3600e3) return Math.floor(diff / 60e3) + ' 分钟前';
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' 小时前';
  return fmtTs(ts).slice(5, 16);
}
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(2) + ' MB';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlight(text, tokens) {
  let out = esc(text);
  for (const t of tokens || []) {
    if (!t) continue;
    try { out = out.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (m) => '<mark>' + m + '</mark>'); } catch {}
  }
  return out;
}
async function api(method, path, body, isForm) {
  const opt = { method, headers: { 'Authorization': 'Bearer ' + TOKEN, 'X-Device': encodeURIComponent(DEVICE_NAME), 'X-Device-Platform': encodeURIComponent(navigator.platform || 'web') } };
  if (body && !isForm) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  if (body && isForm) opt.body = body;
  const r = await fetch(path, opt);
  if (r.status === 401) { logout(); throw new Error('令牌无效'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.message || data.error || ('HTTP ' + r.status));
  return data;
}

/* ================= SSE 实时同步 ================= */
function connectSSE() {
  if (sse) sse.close();
  sse = new EventSource('/api/sync/stream?since_seq=0&name=' + encodeURIComponent(DEVICE_NAME) + '&token=' + encodeURIComponent(TOKEN));
  sse.addEventListener('hello', (ev) => {
    setConn(true);
    try { const d = JSON.parse(ev.data); updatePresence(d); } catch {}
  });
  sse.onopen = () => setConn(true);
  sse.onerror = () => setConn(false);
  sse.addEventListener('presence', (ev) => {
    try { updatePresence(JSON.parse(ev.data)); } catch {}
    if (currentView === 'sync') refreshCurrentView();
  });
  sse.addEventListener('op', (ev) => {
    let op = null;
    try { op = JSON.parse(ev.data); } catch {}
    if (op) {
      activityItems.unshift({ seq: op.seq, ts: op.ts, device: op.device, action: op.action, entity: op.entity, brief: briefOf(op) });
      activityItems = activityItems.slice(0, 60);
      renderActivity();
    }
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => refreshCurrentView(), 500);
  });
}
function briefOf(op) {
  if (op.entity === 'session') return op.data?.title || '';
  if (op.entity === 'message') return String(op.data?.content || '').slice(0, 60);
  if (op.entity === 'memory') return op.data?.key || String(op.data?.content || '').slice(0, 40);
  return op.data?.name || '';
}
function setConn(on) {
  sseOnline = on;
  const b = $('#live-badge');
  b.classList.toggle('off', !on);
  $('#live-text').textContent = on ? `${onlineCount || ''} 个端在线` : '离线';
}
function updatePresence(d) {
  onlineCount = d.online ?? 0;
  onlineNames = d.clients?.map((c) => c.name) || [];
  $('#live-text').textContent = sseOnline ? `${onlineCount} 个端在线` : '离线';
}

function addMemory(sessionId) {
  const key = $('#mem-key').value.trim(), content = $('#mem-content').value.trim();
  if (!content) { toast('内容不能为空'); return; }
  const scope = sessionId ? (confirm('设为全局记忆？（取消 = 仅关联本会话）') ? 'global' : 'session') : 'global';
  api('POST', '/api/memories', { scope, session_id: scope === 'session' ? sessionId : null, key, content })
    .then(() => { toast('已添加'); viewSessionDetail(sessionId); })
    .catch((e) => toast('失败：' + e.message));
}
function exportSession(id) {
  api('GET', `/api/sessions/${id}/context?full=1`).then((b) => {
    const blob = new Blob([JSON.stringify(b, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `session-${id}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  });
}

/* ================= 续接上下文 ================= */
async function copyContext(id) {
  const b = await api('GET', `/api/sessions/${id}/context?full=1`);
  const s = b.session;
  const role = { user: '用户', assistant: '助手', system: '系统', tool: '工具' };
  const lines = [];
  lines.push(`# 会话续接：${s.title}`);
  lines.push('');
  lines.push(`- 标签：${(s.tags || []).join('、') || '无'}`);
  lines.push(`- 来源：${s.source || '-'}`);
  lines.push(`- 时间：${fmtTs(b.stats.first_ts)} ~ ${fmtTs(b.stats.last_ts)}`);
  lines.push(`- 消息数：${b.total_messages}`);
  if (s.summary) { lines.push(''); lines.push('## 摘要'); lines.push(s.summary); }
  lines.push(''); lines.push('## 历史对话（完整）');
  for (const m of b.messages) {
    lines.push('');
    lines.push(`**[${role[m.role] || m.role}]**（${fmtTs(m.ts)}）`);
    lines.push(m.content);
  }
  if (b.memories.length) {
    lines.push(''); lines.push('## 关联记忆');
    for (const m of b.memories) lines.push(`- [${m.scope === 'global' ? '全局' : '会话'}] ${m.key ? m.key + '：' : ''}${m.content}`);
  }
  if (b.files.length) {
    lines.push(''); lines.push('## 会话文件');
    for (const f of b.files) lines.push(`- ${f.name}（${fmtSize(f.size)}，下载：${location.origin}/files/${f.id}?token=${TOKEN}）`);
  }
  lines.push('');
  lines.push('---');
  lines.push('> 请基于以上完整上下文，无缝继续这个会话。');
  const text = lines.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    toast(`续接上下文已复制（${text.length} 字符）· 粘贴到任意设备即可续上`);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('已复制到剪贴板');
  }
}

/* ================= 全局检索 ================= */
async function viewSearch(q) {
  const c = $('#content');
  c.innerHTML = `<div class="page">
    <div class="page-title">检索结果</div>
    <div class="page-sub">关键词 × 类型 × 标签 × 时间 组合过滤</div>
    <div class="toolbar">
      <input id="s-q" value="${esc(q)}" style="flex:1;min-width:200px" placeholder="关键词">
      <select id="s-type"><option value="">全部类型</option><option value="message">消息</option><option value="session">会话</option><option value="memory">记忆</option><option value="file">文件</option></select>
      <select id="s-space"><option value="">全部空间</option></select>
      <select id="s-tag"><option value="">全部标签</option></select>
      <input id="s-from" type="date"><span class="muted">→</span><input id="s-to" type="date">
      <button class="btn primary" onclick="runSearch()">检索</button>
    </div>
    <div id="search-results"><div class="empty">检索中…</div></div>
  </div>`;
  const [r, sp] = await Promise.all([api('GET', '/api/sessions?limit=500'), api('GET', '/api/spaces')]);
  const tags = new Set();
  r.items.forEach((s) => (s.tags || []).forEach((t) => tags.add(t)));
  $('#s-tag').innerHTML = '<option value="">全部标签</option>' + [...tags].sort().map((t) => `<option>${esc(t)}</option>`).join('');
  $('#s-space').innerHTML = '<option value="">全部空间</option>' + sp.items.map((x) => `<option>${esc(x.name)}</option>`).join('');
  runSearch();
}
async function runSearch() {
  const params = new URLSearchParams();
  if ($('#s-q').value.trim()) params.set('q', $('#s-q').value.trim());
  if ($('#s-type').value) params.set('type', $('#s-type').value);
  if ($('#s-tag').value) params.set('tag', $('#s-tag').value);
  if ($('#s-space').value) params.set('space', $('#s-space').value);
  if ($('#s-from').value) params.set('from', $('#s-from').value);
  if ($('#s-to').value) params.set('to', $('#s-to').value);
  params.set('limit', '100');
  const r = await api('GET', '/api/search?' + params.toString());
  const el = $('#search-results');
  if (!r.items.length) { el.innerHTML = '<div class="empty"><span class="icon">🔍</span>没有匹配结果</div>'; return; }
  const typeName = { session: '会话', message: '消息', memory: '记忆', file: '文件' };
  el.innerHTML = `<div class="muted small" style="margin-bottom:12px">命中 ${r.total} 条${r.mode === 'search' ? ` · 覆盖 ${r.matched_sessions} 个会话` : ''}</div>` +
    r.items.map((it) => `
    <div class="card" style="cursor:pointer;margin-bottom:10px" onclick="${it.session_id ? `showView('session','${esc(it.session_id)}')` : ''}">
      <div class="row" style="justify-content:space-between">
        <b style="font-size:13.8px">${it.type === 'message' ? `<span class="tag" style="margin-right:6px">${{user:'用户',assistant:'AI',system:'系统',tool:'工具'}[it.role] || ''}</span>` : ''}${highlight(it.title || '(无标题)', r.q_tokens)}</b>
        <span class="tag">${typeName[it.type] || it.type}</span>
      </div>
      <div style="margin-top:7px;font-size:13.2px;line-height:1.6;color:#3a4456">${highlight(it.snippet || '', r.q_tokens)}</div>
      <div class="muted small" style="margin-top:8px">🕐 ${fmtTs(it.ts)}${it.session_title ? ` · 📁 ${esc(it.session_title)}` : ''}${(it.tags||[]).length ? ` · 🏷 ${esc(it.tags.join(' / '))}` : ''}</div>
    </div>`).join('');
}

/* ================= 记忆库 ================= */
let allMemories = [];
async function viewMemories() {
  const c = $('#content');
  const r = await api('GET', '/api/memories');
  allMemories = r.items;
  c.innerHTML = `<div class="page">
    <div class="page-title">记忆库</div>
    <div class="page-sub">全局与会话级长期记忆 · 随同步流在所有设备间共享</div>
    <div class="toolbar">
      <input id="m-q" placeholder="🔍 按关键词过滤" style="flex:1;min-width:200px" oninput="renderMemories()">
      <button class="btn primary" onclick="addGlobalMemory()">＋ 新增全局记忆</button>
    </div>
    <div class="card" id="mem-all"></div>
  </div>`;
  renderMemories();
}
function renderMemories() {
  const q = ($('#m-q')?.value || '').trim().toLowerCase();
  const list = allMemories.filter((m) => !q || (m.key||'').toLowerCase().includes(q) || (m.content||'').toLowerCase().includes(q));
  $('#mem-all').innerHTML = list.length ? list.map(memRowHtml).join('') : '<div class="empty"><span class="icon">🧠</span>暂无记忆条目</div>';
}
function addGlobalMemory() {
  const key = prompt('记忆键（如：写作风格偏好）：');
  if (key === null) return;
  const content = prompt('记忆内容：');
  if (!content) return;
  api('POST', '/api/memories', { scope: 'global', key, content })
    .then(() => { toast('已添加'); viewMemories(); })
    .catch((e) => toast('失败：' + e.message));
}

/* ================= 同步状态 ================= */

  const c = $('#content');
  const st = await api('GET', '/api/status');
  const up = Math.round(st.uptime_ms / 1000);
  c.innerHTML = `<div class="page">
    <div class="page-title">同步状态</div>
    <div class="page-sub">设备水位、实时连接与服务器健康</div>
    <div class="stat-grid">
      ${statCard('🖥', '#f0eefb', st.online_clients, '端在线', 'SSE')}
      ${statCard('⚡', 'var(--accent-soft)', st.max_seq, '同步序列', '全局操作水位')}
      ${statCard('📦', '#e8f1ff', st.op_count, '累计操作')}
    </div>
    <div class="card" style="margin-bottom:14px">
      <b style="font-size:14px">📡 实时在线的端</b>
      <div class="row" style="margin-top:10px;gap:8px">
        ${st.online_names?.length ? st.online_names.map((n) => `<span class="tag" style="font-size:12.5px;padding:5px 12px">🟢 ${esc(n)}</span>`).join('') : '<span class="muted small">当前无 SSE 连接</span>'}
      </div>
      <div class="muted small" style="margin-top:10px">本页设备名：<code>${esc(DEVICE_NAME)}</code>（在同步事件中以此署名）</div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <b style="font-size:14px">🗂 已登记设备（${st.devices.length}）</b>
      ${st.devices.length ? `<table style="margin-top:6px">
        <tr><th>设备</th><th>平台</th><th>同步水位</th><th>状态</th><th>最后在线</th></tr>
        ${st.devices.map((d) => `<tr>
          <td><b>${esc(d.name)}</b></td><td class="muted">${esc(d.platform || '-')}</td>
          <td><code>${d.last_sync_seq || 0}</code> ${d.last_sync_seq >= st.max_seq ? '✅' : `⏳ 落后 ${st.max_seq - (d.last_sync_seq || 0)}`}</td>
          <td>${Date.now() - (d.last_seen || 0) < 120000 ? '<span class="dot on"></span> 在线' : '<span class="dot off"></span> 离线'}</td>
          <td class="muted">${fmtRel(d.last_seen)}</td>
        </tr>`).join('')}
      </table>` : '<div class="muted small" style="margin-top:8px">暂无设备登记</div>'}
    </div>
    <div class="card">
      <b style="font-size:14px">🖥 服务器</b>
      <table style="margin-top:6px">
        <tr><td>运行时长</td><td>${Math.floor(up / 86400)} 天 ${Math.floor(up % 86400 / 3600)} 时 ${Math.floor(up % 3600 / 60)} 分</td></tr>
        <tr><td>数据规模</td><td>${st.sessions} 会话 · ${st.messages} 消息 · ${st.memories} 全局记忆 · ${st.files} 文件</td></tr>
        <tr><td>设备接入</td><td class="small">Node.js ≥ 18：<code>sync-agent.mjs pull/push --server <span style="word-break:break-all">${esc(location.origin)}</span> --token &lt;令牌&gt;</code></td></tr>
      </table>

/* ================= 设备令牌 ================= */
async function viewTokens() {
  const c = $('#content');
  c.innerHTML = `<div class="page" style="max-width:640px">
    <div class="page-title">设备令牌</div>
    <div class="page-sub">为每台新设备生成独立访问令牌 · 等同完全访问权限，请妥善保管</div>
    <div class="card">
      <div class="row">
        <input id="tk-name" placeholder="设备名称（如：办公室-iMac）" style="flex:1">
        <button class="btn primary" onclick="createToken()">生成令牌</button>
      </div>
      <div id="tk-result" style="margin-top:16px"></div>
    </div>
  </div>`;
}
async function createToken() {
  const name = $('#tk-name').value.trim() || 'device';
  try {
    const r = await api('POST', '/api/auth/token', { name });
    $('#tk-result').innerHTML = `<div style="padding:14px;background:var(--accent-soft);border-radius:12px;font-size:13px">
      设备 <b>${esc(name)}</b> 的令牌（仅显示一次，请立即保存）：<br><br>
      <code style="font-size:13.5px;word-break:break-all;display:block;padding:10px;background:#fff;border-radius:8px">${esc(r.token)}</code></div>`;
  } catch (e) { toast('失败：' + e.message); }
}

/* ================= 隐私模式 ================= */
function applyPrivacy(on) {
  document.body.classList.toggle('privacy-mode', on);
  const btn = $('#privacy-btn');
  if (btn) {
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));
    $('#eye-open').style.display = on ? 'none' : '';
    $('#eye-off').style.display = on ? '' : 'none';
  }
}
function togglePrivacy() {
  const on = !document.body.classList.contains('privacy-mode');
  applyPrivacy(on);
  localStorage.setItem('ss_privacy', on ? '1' : '0');
  toast(on ? '隐私模式已开启：对话内容已模糊（悬停可临时查看）' : '隐私模式已关闭');
}

/* ================= 启动 ================= */
(function () {
  const qToken = new URLSearchParams(location.search).get('token');
  if (qToken) {
    TOKEN = qToken;
    localStorage.setItem('ss_token', TOKEN);
    history.replaceState(null, '', location.pathname);
  }
  if (localStorage.getItem('ss_privacy') === '1') applyPrivacy(true);
  if (TOKEN) {
    api('GET', '/api/status').then(enterApp).catch(() => { $('#login').style.display = 'flex'; });
  }
})();
</script>
