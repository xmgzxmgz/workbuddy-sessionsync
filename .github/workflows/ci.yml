name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Syntax + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check (all modules)
        run: |
          for f in server.mjs lib/*.mjs agent/*.mjs test/*.mjs; do
            echo "check $f"
            node --check "$f"
          done

      - name: End-to-end smoke test
        run: node test/smoke.mjs
